name: lint-free
on: [push, pull_request]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # repeat same job for each subsystem in the following subdirectories
        subdir: [web-app, machine-learning-client]
    defaults:
      run:
        working-directory: ${{ matrix.subdir }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: ${{ hashFiles(format('{0}/**/*.py', matrix.subdir)) != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          pipenv sync --dev --python $(which python)
      - name: Pylint (MLC)
        if: matrix.subdir == 'machine-learning-client'
        run: pipenv run pylint --init-hook="import sys; sys.path.insert(0,'.')" main.py tests/
      - name: Pylint (Web app)
        if: matrix.subdir == 'web-app'
        run: pipenv run pylint .
      - name: Format with black
        if: ${{ hashFiles(format('{0}/**/*.py', matrix.subdir)) != '' }}
        run: pipenv run black --diff --check .